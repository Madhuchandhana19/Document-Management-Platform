server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 1000

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:madhu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 200
      minimum-idle: 50
      idle-timeout: 30000
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:your_32_character_long_super_secret_key_at_least_256_bits}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
